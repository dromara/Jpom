# Gitee Go 定时刷新 jdk 下载清单（每天北京时间 08:00；手动运行也可）。
# 与旧版差异：
#   - 只保留定时触发，去掉 push 触发（旧版会被机器人自己 push 的提交再次触发，成对空跑、烧构建时长）
#   - artifact 路径修正为 ./jdk（旧版写的是 Jpom/jdk/，与实际工作目录不符）
#   - 增加 stepTimeout，避免卡死占用额度

version: '1.0'
name: tsinghua-jdk
displayName: tsinghua-jdk
triggers:
  trigger: auto
  schedule:
    # 实测含义：秒=0、分=0、时=8，按北京时间每天 08:00 触发
    # （Gitee Go 帮助中心写的是“M H D m d y”，与实际解析不一致，改配置后需看构建记录验证）
    - cron: '0 0 8 * * ?'
stages:
  - name: stage-95187e4b
    displayName: tsinghua-jdk
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@ruby
        name: build_ruby
        displayName: Ruby 构建
        rubyVersion: 3.0.2
        commands:
          - bundle install
          - ruby jdk.rb
          - ls -lR jdk/
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./jdk
        caches: []
        notify: []
        strategy:
          retry: '0'
strategy:
  blocking: true
  stepTimeout: 15
