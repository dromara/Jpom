name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: cd web-vue && npm i && npm run build
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      # 根 pom 默认 maven.test.skip=true，package 不会执行单测；单独跑核心回归测试，
      # 防止 2.11.13 那样「共享基础类改动+单测只覆盖工具函数」的回归再次漏出。
      - name: Run regression unit tests
        run: bash script/run-regression-tests.sh
