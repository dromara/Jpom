name: release-package

# 构建 Jpom 发布包（server/agent 的 zip、tar.gz、sha1 + 合并包 + Go 插件端多架构产物）并上传 Cloudflare R2。
#
# 设计要点：
# 1. 稳定版：推 tag `v*` 后自动构建并上传到 R2 `release/<version>/`（与 d2 路径一致，只是上传走 R2 S3 API）。
# 2. beta：由 `release.sh beta`（或手动 dispatch）触发，上传到 `beta/<version>/`。
# 3. 分支 push（仅 workflow/辅助脚本变更）触发一次 dry_run 自检：Go 质量门禁（gofmt/build/vet/test）
#    + 构建 + 校验，不上传。
# 4. 校验使用与 release.sh 相同的 `script/verify-release-artifacts.sh`；回验用 r2.dev（runner 访问 d2 会被 Cloudflare challenge）。
# 5. 需要仓库 secrets：R2_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（建议只对 jpom-releases-apac bucket 读写的 R2 API Token）。
# 6. 可选仓库变量：R2_BUCKET（默认 jpom-releases-apac）、JPOM_DOWNLOAD_BASE（回验基址，默认 r2.dev）、
#    GO_AGENT_MIN_VERSION（Go 升级容器 agent.json.minVersion，默认 1.0.0，后续 Go 版本不兼容时提高）。
#
# Go 插件端产物（与 Java 产物同版本目录，供 Server 在线升级/下载中心使用）：
#   安装包（5 平台，非 Windows 出 zip+tar.gz，Windows 只出 zip）：
#     agent-go-<version>-release-linux-amd64.{zip,tar.gz}
#     agent-go-<version>-release-linux-arm64.{zip,tar.gz}
#     agent-go-<version>-release-darwin-amd64.{zip,tar.gz}
#     agent-go-<version>-release-darwin-arm64.{zip,tar.gz}
#     agent-go-<version>-release-windows-amd64.zip
#   在线升级容器（5 平台，Server 按节点平台下发）+ linux/amd64 兼容别名：
#     agent-go-<version>-upgrade-<os>-<arch>.jar
#     agent-go-<version>-upgrade.jar（= linux/amd64 副本，供旧 Server 手工上传/默认回退）
# 说明：每个升级容器内含对应平台可执行文件与 go-agent/agent.json（version/timeStamp/minVersion/
#       platform/sha256），Agent 端会做平台精确匹配，不匹配的容器会被拒绝且不改动现有二进制。
#
# 安全：R2 凭据只从 secrets 注入，绝不落盘/打印；POC 用 target_prefix=ci-test（不写正式目录）。

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道：auto（tag→release，beta 分支→beta，其余→release）'
        type: choice
        options: [auto, release, beta]
        default: auto
      version:
        description: '版本号（留空自动推导：tag / script/tag.release.txt / tag.beta.txt）'
        type: string
        required: false
      target_prefix:
        description: '目标路径前缀（POC/灰度；空=正式目录；示例：ci-test）'
        type: string
        required: false
      dry_run:
        description: '只构建+校验，不上传 R2'
        type: boolean
        default: false
      deep_verify:
        description: '上传后下载全部对象逐字节比对 sha1（更严格、更慢）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - beta
    # tag push 不评估 paths；分支 push 仅当 workflow/辅助脚本变更时触发自检（dry_run）
    paths:
      - '.github/workflows/release-package.yml'
      - 'script/release-ci-meta.sh'
      - 'script/verify-release-artifacts.sh'
      - 'script/r2-upload-ci.sh'

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref_name }}-${{ inputs.version || 'auto' }}
  cancel-in-progress: false

env:
  JPOM_DOWNLOAD_BASE: ${{ vars.JPOM_DOWNLOAD_BASE || 'https://pub-a46506c7e8ff43fabc4c1ce8e5faffcb.r2.dev' }}
  R2_BUCKET: ${{ vars.R2_BUCKET || 'jpom-releases-apac' }}
  GO_AGENT_MIN_VERSION: ${{ vars.GO_AGENT_MIN_VERSION || '1.0.0' }}

jobs:
  package:
    name: 构建并上传 R2（${{ github.ref_name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析发布元数据
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_TARGET_PREFIX: ${{ inputs.target_prefix || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          INPUT_DEEP_VERIFY: ${{ inputs.deep_verify && 'true' || 'false' }}
        run: bash script/release-ci-meta.sh

      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 设置 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: go-agent/go.sum

      - name: Go 质量门禁（gofmt/build/vet/test）
        working-directory: go-agent
        shell: bash
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/go-mod-cache"
          export GOCACHE="$RUNNER_TEMP/go-build-cache"
          export GOTMPDIR="$RUNNER_TEMP/go-tmp"
          mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR"
          unformatted=$(gofmt -l $(find . -path ./.cache -prune -o -name "*.go" -print))
          if [ -n "${unformatted}" ]; then
            echo "以下文件未 gofmt："
            echo "${unformatted}"
            exit 1
          fi
          go build ./...
          go vet ./...
          go test ./...

      - name: 构建 Go 插件端多架构发布包与在线升级容器
        working-directory: go-agent
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GO_AGENT_MIN_VERSION: ${{ vars.GO_AGENT_MIN_VERSION || '1.0.0' }}
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/go-mod-cache"
          export GOCACHE="$RUNNER_TEMP/go-build-cache"
          export GOTMPDIR="$RUNNER_TEMP/go-tmp"
          mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 构建平台清单（安装包 5 平台；升级容器同 5 平台 + linux/amd64 兼容别名）
          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          # 1) 5 平台安装包：agent-go-<version>-release-<os>-<arch>.{zip,tar.gz,sha1}
          #    （package.sh 要求显式提供 VERSION，避免回退 tag.release.txt 产出错误版本）
          PLATFORMS="${PLATFORMS}" bash script/package.sh
          # 2) 逐平台交叉编译二进制并打成可过 checkJpomJar 的 jar 运输容器
          #    build-upgrade-container.sh 用 javac --release 8 编译空壳 Main-Class（JDK9+ 参数）；
          #    使用 runner 预装的 JDK17/21，避免下一步 setup-java 8 后拿不到 --release 参数。
          container_java_home="${JAVA_HOME_17_X64:-${JAVA_HOME_21_X64:-${JAVA_HOME:-}}}"
          if [ -z "${container_java_home}" ]; then
            echo "::error::未找到可用 JDK（构建 Go 升级容器需要 javac --release 8 支持的 JDK）"
            exit 1
          fi
          for platform in ${PLATFORMS}; do
            os="${platform%/*}"
            arch="${platform#*/}"
            suffix=""
            if [ "${os}" = "windows" ]; then
              suffix=".exe"
            fi
            binary="build/agent-${os}-${arch}${suffix}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" bash script/go.sh build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
              -o "${binary}" .
            JAVA_HOME="${container_java_home}" PATH="${container_java_home}/bin:${PATH}" \
              VERSION="${VERSION}" PLATFORM="${platform}" BINARY="${binary}" \
              MIN_VERSION="${GO_AGENT_MIN_VERSION}" TIME_STAMP="${BUILD_TIME}" \
              bash script/build-upgrade-container.sh
          done
          # 3) linux/amd64 兼容别名（旧 Server 手工上传/默认回退用；构建脚本可能已生成，这里保证存在且最新）
          cp -f "dist/agent-go-${VERSION}-upgrade-linux-amd64.jar" "dist/agent-go-${VERSION}-upgrade.jar"
          # 4) 为全部 Go 产物生成 sha1（安装包 sha1 由 package.sh 生成，这里补齐升级容器与别名）
          (cd dist && for f in agent-go-*; do
            case "$f" in
            *.sha1) continue ;;
            esac
            sha1sum "$f" | awk '{print $1}' > "$f.sha1"
          done)
          ls -lh dist/

      - name: 校验 Go 发布产物（命名/压缩包完整/sha1/升级容器元信息）
        shell: bash
        run: |
          set -euo pipefail
          bash script/verify-release-artifacts.sh \
            --parent-dir . \
            --version '${{ steps.meta.outputs.version }}' \
            --verify-go --go-only

      - name: 清理 Go 构建缓存（避免 Maven license 插件扫描只读缓存文件）
        shell: bash
        run: |
          rm -rf go-agent/.cache go-agent/build

      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 构建前端
        working-directory: web-vue
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: 构建后端发布包
        working-directory: .
        run: |
          set -euo pipefail
          mvn -B -e clean package -Dmaven.test.skip=true -Dmaven.compile.fork=true

      - name: 校验发布产物（与 release.sh 同一套校验）
        shell: bash
        run: |
          set -euo pipefail
          bash script/verify-release-artifacts.sh \
            --parent-dir . \
            --version '${{ steps.meta.outputs.version }}'

      - name: 安装 rclone
        if: ${{ steps.meta.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q -o /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 755 /tmp/rclone/rclone-*/rclone /usr/local/bin/rclone
          rclone version | head -n 3

      - name: 上传发布包到 R2
        if: ${{ steps.meta.outputs.dry_run != 'true' }}
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_PREFIX: ${{ steps.meta.outputs.target_prefix }}
          DEEP_VERIFY: ${{ steps.meta.outputs.deep_verify }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::缺少 R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets，请由维护者按发布流程配置"
            exit 1
          fi
          args=(--channel "${CHANNEL}" --version "${VERSION}" --prefix "${TARGET_PREFIX}")
          [ "${DEEP_VERIFY}" = "true" ] && args+=(--deep-verify)
          R2_PUBLIC_BASE="${JPOM_DOWNLOAD_BASE}" R2_BUCKET="${R2_BUCKET}" \
            bash script/r2-upload-ci.sh "${args[@]}"

      - name: 写入执行摘要
        if: always()
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
          REMOTE_REL: ${{ steps.meta.outputs.remote_rel }}
          PUBLIC_BASE: ${{ steps.meta.outputs.public_base }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          SELF_TEST: ${{ steps.meta.outputs.self_test }}
          DEEP_VERIFY: ${{ steps.meta.outputs.deep_verify }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Jpom 发布包：${VERSION}"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 事件 | ${EVENT_NAME} @ ${REF_NAME} |"
            echo "| 渠道 | ${CHANNEL} |"
            echo "| 目标路径 | \`${REMOTE_REL}/\` |"
            echo "| 下载基址 | ${PUBLIC_BASE}/${REMOTE_REL}/ |"
            echo "| dry-run | ${DRY_RUN} |"
            echo "| 分支自检 | ${SELF_TEST} |"
            echo "| deep-verify | ${DEEP_VERIFY} |"
            echo
            echo "Java 产物 sha1（本地计算）："
            echo '```'
            for kind in server agent; do
              for ext in zip tar.gz; do
                file="modules/${kind}/target/${kind}-${VERSION}-release.${ext}"
                [ -f "$file" ] && echo "${file##*/}  $(sha1sum "$file" | awk '{print $1}')  $(du -h "$file" | cut -f1)"
              done
            done
            echo '```'
            echo
            echo "Go 产物 sha1（本地计算）："
            echo '```'
            for file in go-agent/dist/agent-go-*; do
              case "$file" in
              *.sha1) continue ;;
              esac
              [ -f "$file" ] && echo "${file##*/}  $(sha1sum "$file" | awk '{print $1}')  $(du -h "$file" | cut -f1)"
            done
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
